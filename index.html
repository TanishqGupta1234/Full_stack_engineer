<!-- html - markup language Basically joh marker ke form mein likhte h <> ise krke
HTML content ko instructions nahi deta ki calculation kaise karni hai; HTML
content ko label karta hai ki ye heading hai, ye paragraph hai, ye image hai,
etc. 

h1 tag - for heading purpose
p tag - for paragraph purpose
br tag - for line break
hr tag - for horizontal line
ol tag - for ordered list
ul tag - for unordered list
img tag - for image purpose and alt and src are attributes of img tag
src attribute - it is used to specify the path of the image
alt attribute - it is used to specify the alternate text for the image if the image is not available
anchor tag - it is used to create a hyperlink to another webpage or resource. The href attribute specifies the URL of the page the link goes to.
form tag - it is used to create a form for user input. The action attribute specifies where to send the form data when the form is submitted.
placeholder attribute - it is used to provide a hint or example of what the user should enter in an input field. It is displayed inside the input field until the user starts typing.
video tag - it is used to embed a video in a webpage. The src attribute specifies the path of the video file, and the controls attribute adds playback controls to the video player.
video tag (autoplay) - it is used to automatically start playing the video when the page loads. The autoplay attribute is added to the video tag to enable this feature.
video tag (loop) - it is used to make the video play in a continuous loop. The loop attribute is added to the video tag to enable this feature.
div tag - it is used to group and organize content on a webpage. It is a container element that can hold other HTML elements and can be styled using CSS.

-->
